<body oncontextmenu="return false;">
    <script>
        // Paint the last used theme's background before Blazor boots, so a reload does not
        // flash the other theme (the app sets and stores the theme, see applyTheme).
        (function () {
            try {
                // Light until the app has stored a theme (Light is the default).
                var isDark = localStorage.getItem("dep-theme") === "dark";
                document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
                document.body.style.backgroundColor = isDark ? "#101113" : "#FAFAFA";
            } catch (e) { }
        })();
    </script>

    <script
        data-clerk-publishable-key="pk_test_cmVuZXdlZC1oZW4tOTguY2xlcmsuYWNjb3VudHMuZGV2JA"

    <script>
        // Startup dispatcher — two page-load modes:
        //
        // Mode 1 — Magic-link redirect (dep-clerk-signin flag in localStorage)
        //   The tab opened by clicking the magic link email for standalone WASM.
        //   Broadcasts sign-in completion to the original tab.
        //
        // Mode 2 — Normal page load → Blazor.start()
        //
        // Note: VS Code extension sign-in is handled entirely by the extension's
        // own local HTTP server (cloudSyncNode.ts) and does not use this page.

        (function () {
            var signinPending = localStorage.getItem("dep-clerk-signin");
            if (signinPending && (Date.now() - parseInt(signinPending, 10)) < 600000) {
                // sessionStorage is per-tab: the tab that called clerkSignIn() set
                // this flag, so a reload of that same tab will still have it.
                // A NEW tab (magic-link redirect) will not.
                var isOriginalTab = sessionStorage.getItem("dep-clerk-signin-initiator");

                if (isOriginalTab) {
                    // ── Original tab reloaded by Clerk after sign-in ──
                    // Clean up and start the app normally (user is now signed in).
                    localStorage.removeItem("dep-clerk-signin");
                    sessionStorage.removeItem("dep-clerk-signin-initiator");
                    Blazor.start();
                    return;
                }

                // ── Magic-link redirect tab ──
                // Show a minimal page instead of loading the full WASM app.
                document.getElementById("app").innerHTML =
                    "<div style='color:#ccc;font-family:sans-serif;text-align:center;margin-top:40vh;'>"
                    + "<p>Completing sign-in...</p></div>";

                var start = Date.now();
                var iv = setInterval(async function () {
                    var c = window.Clerk;
                    if (c && !c.loaded && typeof c.load === "function" && !c._bootCalled) {
                        c._bootCalled = true;
                        try { await c.load(); } catch (_) { }
                    }
                    if (c && c.loaded) {
                        clearInterval(iv);
                        if (c.user || c.session) {
                            localStorage.removeItem("dep-clerk-signin");
                            document.getElementById("app").innerHTML =
                                "<div style='color:#ccc;font-family:sans-serif;text-align:center;margin-top:40vh;'>"
                                + "<p>Sign-in complete! You can close this tab.</p></div>";
                            try {
                                var bc = new BroadcastChannel("dep-clerk-auth");
                                bc.postMessage({ type: "signed-in" });
                                bc.close();
                            } catch (_) { }
                        } else {
                            localStorage.removeItem("dep-clerk-signin");
                            Blazor.start();
                        }
                        return;
                    }
                    if (Date.now() - start > 15000) {
                        clearInterval(iv);
                        localStorage.removeItem("dep-clerk-signin");
                        Blazor.start();
                    }
                }, 200);
                return;
            }

            // ── Normal page load ──
            Blazor.start();
        })();
    </script>
    <!-- TEMPORARY iPad fog experiment (PR #187): remove before merging. -->
    <style>
        #fog-test { position: fixed; left: 12px; bottom: 12px; z-index: 3000; background: #fff3; font: 13px sans-serif;
            background: #ffe9a8; border: 1px solid #c90; border-radius: 6px; padding: 6px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        #fog-test button { font: 13px sans-serif; padding: 4px 8px; border: 1px solid #999; border-radius: 4px; background: #fff; }
        #fog-test button.on { background: #6200ea; color: #fff; }
        html.fog-short .drop-zone, html.fog-short #svgcanvas { height: 50vh !important; overflow: hidden; }
        html.fog-short .mud-layout { min-height: 0 !important; height: 50vh !important; }
        #fog-bar, #fog-header, #fog-overlay { display: none; position: fixed; left: 0; right: 0; top: 0; pointer-events: none; }
        html.fog-bar #fog-bar { display: block; height: 8px; background: #b39ddb; z-index: 2500; }
        html.fog-header #fog-header { display: block; height: 64px; background: #fafafa; border-bottom: 1px solid #ddd; }
        #fog-hitbar, #fog-hitoverlay { display: none; position: fixed; left: 0; right: 0; top: 0; }
        html.fog-hitbar #fog-hitbar { display: block; height: 8px; background: #b39ddb; z-index: 2500; }
        html.fog-hitoverlay #fog-hitoverlay { display: block; bottom: 0; background: transparent; z-index: 1500; }
        html.fog-overlay #fog-overlay { display: block; bottom: 0; background: transparent; z-index: 1500; }
    </style>
    <script>
        (function () {
            var variants = ["off", "short", "bar", "header", "overlay", "hitbar", "hitoverlay"];
            var current = "off";
            try { current = localStorage.getItem("fog-test") || "off"; } catch (e) { }
            function apply(v) {
                variants.forEach(function (x) { document.documentElement.classList.remove("fog-" + x); });
                document.documentElement.classList.add("fog-" + v);
                current = v;
                try { localStorage.setItem("fog-test", v); } catch (e) { }
                document.querySelectorAll("#fog-test button").forEach(function (b) { b.classList.toggle("on", b.textContent === v); });
            }
            window.addEventListener("DOMContentLoaded", function () {
                ["fog-header", "fog-bar", "fog-overlay", "fog-hitbar", "fog-hitoverlay"].forEach(function (id) {
                    var d = document.createElement("div"); d.id = id;
                    if (id === "fog-header") document.body.insertBefore(d, document.body.firstChild); else document.body.appendChild(d);
                });
                var panel = document.createElement("div"); panel.id = "fog-test";
                panel.innerHTML = "<b>Fog test 4</b>";
                variants.forEach(function (v) {
                    var b = document.createElement("button"); b.textContent = v;
                    b.onclick = function () { apply(v); }; panel.appendChild(b);
                });
                document.body.appendChild(panel);
                apply(current);
            });
        })();
    </script>
