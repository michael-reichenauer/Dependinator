<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-label="Cloud sync and identity view: users sign in with Clerk (Clerk.js in the browser app, a loopback sign-in page from the VS Code extension); the browser UI calls the Functions API with a Bearer token, while in VS Code the language server calls it with the token the extension keeps in secret storage. The API validates the token against Clerk&#x27;s signing keys and reads and writes the user&#x27;s gzipped models in Blob Storage, at most 10 MB per user." font-family="Segoe UI, Inter, system-ui, sans-serif" style="max-width:100%;height:auto;color:var(--fg,#1f2937)"><title>Dependinator cloud sync and identity view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #2563eb)"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent2, #b45309)"/></marker><symbol id="ic-Authentication" viewBox="0 0 24 24"><defs><linearGradient id="gradAuthentication" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradAuthentication)" /><g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.6" cy="10.4" r="3" /><path d="M11.7,12.5 l4.5,4.5" /><path d="M14.4,14.8 l1.3,-1.3" /><path d="M15.7,16.1 l1.3,-1.3" /></g></symbol><symbol id="ic-Azure-Functions" viewBox="0 0 18 18"><defs><linearGradient id="Azure-Functions-i1" x1="-175.993" y1="-343.723" x2="-175.993" y2="-359.232" gradientTransform="translate(212.573 370.548) scale(1.156 1.029)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fea11b" /><stop offset="0.284" stop-color="#fea51a" /><stop offset="0.547" stop-color="#feb018" /><stop offset="0.8" stop-color="#ffc314" /><stop offset="1" stop-color="#ffd70f" /></linearGradient></defs><g><path d="M2.37,7.475H3.2a.267.267,0,0,1,.267.267v6.148a.533.533,0,0,1-.533.533H2.1a0,0,0,0,1,0,0V7.741a.267.267,0,0,1,.267-.267Z" transform="translate(12.507 16.705) rotate(134.919)" fill="#50e6ff" /><path d="M2.325,3.6h.833a.267.267,0,0,1,.267.267v6.583a0,0,0,0,1,0,0H2.591a.533.533,0,0,1-.533-.533V3.865A.267.267,0,0,1,2.325,3.6Z" transform="translate(5.759 0.114) rotate(44.919)" fill="#1490df" /></g><g><path d="M14.53,7.475h.833a.533.533,0,0,1,.533.533v6.148a.267.267,0,0,1-.267.267H14.8a.267.267,0,0,1-.267-.267V7.475a0,0,0,0,1,0,0Z" transform="translate(12.223 -7.555) rotate(45.081)" fill="#50e6ff" /><path d="M15.108,3.6h.833a0,0,0,0,1,0,0v6.583a.267.267,0,0,1-.267.267h-.833a.267.267,0,0,1-.267-.267V4.131a.533.533,0,0,1,.533-.533Z" transform="translate(31.022 1.222) rotate(135.081)" fill="#1490df" /></g><path d="M8.459,9.9H4.87a.193.193,0,0,1-.2-.181.166.166,0,0,1,.018-.075L8.991,1.13a.206.206,0,0,1,.186-.106h4.245a.193.193,0,0,1,.2.181.165.165,0,0,1-.035.1L8.534,7.966h4.928a.193.193,0,0,1,.2.181.176.176,0,0,1-.052.122L5.421,16.788c-.077.046-.624.5-.356-.189h0Z" fill="url(#Azure-Functions-i1)" /></symbol><symbol id="ic-Blob-Storage" viewBox="0 0 18 18"><defs><linearGradient id="Blob-Storage-i1" x1="9" y1="15.834" x2="9" y2="5.788" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#32bedd" /><stop offset="0.775" stop-color="#32d4f5" /></linearGradient></defs><g><g><path d="M.5,5.788h17a0,0,0,0,1,0,0v9.478a.568.568,0,0,1-.568.568H1.068A.568.568,0,0,1,.5,15.266V5.788A0,0,0,0,1,.5,5.788Z" fill="url(#Blob-Storage-i1)" /><path d="M1.071,2.166H16.929a.568.568,0,0,1,.568.568V5.788a0,0,0,0,1,0,0H.5a0,0,0,0,1,0,0V2.734A.568.568,0,0,1,1.071,2.166Z" fill="#0078d4" /><rect x="2.328" y="7.049" width="6.281" height="3.408" rx="0.283" fill="#0078d4" /><rect x="9.336" y="7.049" width="6.281" height="3.408" rx="0.283" fill="#fff" /><rect x="2.296" y="11.128" width="6.281" height="3.408" rx="0.283" fill="#0078d4" /><rect x="9.304" y="11.128" width="6.281" height="3.408" rx="0.283" fill="#0078d4" /></g></g></symbol><symbol id="ic-Parsing" viewBox="0 0 24 24"><defs><linearGradient id="gradParsing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradParsing)" /><path d="M6.5,7.5 h11 l-4.2,5 v4.2 l-2.6,1.3 v-5.5 z" fill="#fff" /></symbol><symbol id="ic-Security" viewBox="0 0 24 24"><defs><linearGradient id="gradSecurity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradSecurity)" /><path d="M12,6 l5,2 v3.2 c0,3.4 -2.2,5.6 -5,6.6 c-2.8,-1 -5,-3.2 -5,-6.6 v-3.2 z" fill="#fff" /><path d="M9.9,12.2 l1.6,1.6 3,-3.3" fill="none" stroke="#5B45CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol><symbol id="ic-View" viewBox="0 0 24 24"><defs><linearGradient id="gradView" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradView)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="6.5" width="13" height="11" rx="1.6" /><line x1="5.5" y1="9.6" x2="18.5" y2="9.6" /></g><g fill="#fff"><circle cx="7.7" cy="8" r="0.65" /><circle cx="9.6" cy="8" r="0.65" /></g></symbol></defs><rect width="1400" height="760" fill="var(--bg, #ffffff)"/><rect x="20" y="60" width="400" height="230" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="50" y="105" width="340" height="160" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-View" x="60" y="114" width="24" height="24"/><text x="92" y="131" font-size="12.5" font-weight="600" fill="currentColor">Dependinator.UI</text><text x="62" y="153" font-size="11" fill="currentColor" fill-opacity="0.78">AppCloudSyncService: compares the local</text><text x="62" y="168" font-size="11" fill="currentColor" fill-opacity="0.78">and the cloud copy by content hash,</text><text x="62" y="183" font-size="11" fill="currentColor" fill-opacity="0.78">pushes local edits, pulls newer copies</text><text x="62" y="198" font-size="11" fill="currentColor" fill-opacity="0.78">HttpCloudSyncService: calls /api</text><text x="62" y="213" font-size="11" fill="currentColor" fill-opacity="0.78">Clerk.js: sign-in in the page</text><rect x="20" y="330" width="400" height="400" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="50" y="375" width="340" height="90" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-View" x="60" y="384" width="24" height="24"/><text x="92" y="401" font-size="12.5" font-weight="600" fill="currentColor">Dependinator.UI (webview)</text><text x="62" y="423" font-size="11" fill="currentColor" fill-opacity="0.78">the same AppCloudSyncService; calls go</text><text x="62" y="438" font-size="11" fill="currentColor" fill-opacity="0.78">over the JSON-RPC tunnel (view 5)</text><rect x="50" y="505" width="340" height="90" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Parsing" x="60" y="514" width="24" height="24"/><text x="92" y="531" font-size="12.5" font-weight="600" fill="currentColor">CloudSyncRpcService (language server)</text><text x="62" y="553" font-size="11" fill="currentColor" fill-opacity="0.78">makes the HTTP calls with</text><text x="62" y="568" font-size="11" fill="currentColor" fill-opacity="0.78">Core&#x27;s CloudSyncHttpClient</text><rect x="50" y="635" width="340" height="80" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Security" x="60" y="644" width="24" height="24"/><text x="92" y="661" font-size="12.5" font-weight="600" fill="currentColor">cloudSyncAuth.ts (extension)</text><text x="62" y="683" font-size="11" fill="currentColor" fill-opacity="0.78">loopback sign-in page with Clerk.js,</text><text x="62" y="698" font-size="11" fill="currentColor" fill-opacity="0.78">token kept in SecretStorage</text><path d="M 220.0 465.0 L 220.0 505.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="226.0" y="489.0" font-size="10.5" text-anchor="start" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">JSON-RPC</text><path d="M 220.0 595.0 L 220.0 635.0" fill="none" stroke="var(--accent2, #b45309)" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#arrow-async)" marker-end="url(#arrow-async)"/><text x="226.0" y="619.0" font-size="10.5" text-anchor="start" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">token, sign-in</text><use href="#ic-Authentication" x="618.0" y="108.0" width="44" height="44"/><text x="640" y="166.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Clerk</text><text x="640" y="179.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">hosted sign-in; issues the JWT,</text><text x="640" y="191.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">publishes its signing keys</text><rect x="820" y="200" width="560" height="530" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="850" y="250" width="300" height="105" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Security" x="860" y="259" width="24" height="24"/><text x="892" y="276" font-size="12.5" font-weight="600" fill="currentColor">CloudSyncBearerTokenValidator</text><text x="862" y="298" font-size="11" fill="currentColor" fill-opacity="0.78">checks the JWT&#x27;s signature against Clerk&#x27;s</text><text x="862" y="313" font-size="11" fill="currentColor" fill-opacity="0.78">keys (JWKS) and its issuer; the user id</text><text x="862" y="328" font-size="11" fill="currentColor" fill-opacity="0.78">comes from the token</text><rect x="850" y="400" width="300" height="150" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Azure-Functions" x="860" y="409" width="24" height="24"/><text x="892" y="426" font-size="12.5" font-weight="600" fill="currentColor">Functions</text><text x="862" y="448" font-size="11" fill="currentColor" fill-opacity="0.78">GET /api/auth/me</text><text x="862" y="463" font-size="11" fill="currentColor" fill-opacity="0.78">GET /api/models</text><text x="862" y="478" font-size="11" fill="currentColor" fill-opacity="0.78">GET /api/models/{key}</text><text x="862" y="493" font-size="11" fill="currentColor" fill-opacity="0.78">PUT /api/models/{key}</text><text x="862" y="508" font-size="11" fill="currentColor" fill-opacity="0.78">DELETE /api/models/{key}</text><use href="#ic-Blob-Storage" x="1263.0" y="453.0" width="44" height="44"/><text x="1285" y="511.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Blob Storage</text><text x="1285" y="524.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">dependinator-models/&lt;user&gt;/&lt;key&gt;</text><text x="1285" y="536.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">gzipped model; hash and time</text><text x="1285" y="548.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">in the blob metadata</text><text x="850" y="600" font-size="11" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1">What the API enforces</text><text x="850" y="615" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">· every call needs a valid token; users only reach their own folder</text><text x="850" y="630" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">· at most 10 MB of models per user (CloudSyncOptions)</text><text x="850" y="645" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">· a model&#x27;s key is its normalized path, the same on every device</text><text x="850" y="660" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">· tokens count as valid for 180 days after issue: a workaround for</text><text x="850" y="675" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">  the 7-day limit of Clerk&#x27;s free tier</text><path d="M 390.0 120.0 L 612.0 120.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="501.0" y="114.0" font-size="10.5" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">sign in (Clerk.js)</text><path d="M 390.0 690.0 L 560.0 690.0 L 560.0 142.0 L 612.0 142.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="552.3" y="684.0" font-size="10.5" text-anchor="end" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">sign in (loopback page)</text><path d="M 390.0 225.0 L 720.0 225.0 L 720.0 455.0 L 850.0 455.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="489.0" y="219.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">Bearer JWT</text><path d="M 390.0 550.0 L 760.0 550.0 L 760.0 505.0 L 850.0 505.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="501.0" y="544.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">Bearer JWT</text><path d="M 1120.0 250.0 L 1120.0 130.0 L 668.0 130.0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="894.0" y="124.0" font-size="10.5" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">signing keys (JWKS), cached</text><path d="M 1000.0 400.0 L 1000.0 355.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1006.0" y="381.5" font-size="10.5" text-anchor="start" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">who is calling?</text><path d="M 1150.0 475.0 L 1257.0 475.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="1203.5" y="455.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">list, read,</text><text x="1203.5" y="467.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">write, delete</text><text x="40" y="752" font-size="10.5" text-anchor="start" fill="currentColor" fill-opacity="0.8">Both clients send the token in Authorization and in X-Dependinator-Authorization, since Static Web Apps may drop the standard header before the Functions see it.</text><text x="32" y="80" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Browser app</text><text x="32" y="96" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">dependinator.com</text><text x="32" y="350" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">VS Code</text><text x="32" y="366" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">the same UI, another transport</text><text x="832" y="220" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Azure Static Web Apps · /api</text><text x="832" y="236" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">src/Api, Azure Functions (isolated worker)</text></svg>