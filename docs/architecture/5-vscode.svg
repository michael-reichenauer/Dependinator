<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 790" role="img" aria-label="VS Code integration view: the UI in the webview calls [Rpc] interfaces through Core&#x27;s JsonRpcService, whose messages go via postMessage to the extension host, which relays them as LSP notifications over stdio to the language server, where another JsonRpcService dispatches them to the parser, workspace file, cloud sync and Claude services. The extension also sends editor, refresh and search messages to the UI, starts the server, and keeps the Clerk token and Claude key in VS Code&#x27;s secret storage." font-family="Segoe UI, Inter, system-ui, sans-serif" style="max-width:100%;height:auto;color:var(--fg,#1f2937)"><title>Dependinator VS Code integration view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #2563eb)"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent2, #b45309)"/></marker><symbol id="ic-Communication" viewBox="0 0 24 24"><defs><linearGradient id="gradCommunication" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradCommunication)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5,10 h7.5" /><path d="M13,8 l2,2 -2,2" /><path d="M16.5,14 h-7.5" /><path d="M11,12 l-2,2 2,2" /></g></symbol><symbol id="ic-Configuration" viewBox="0 0 24 24"><defs><linearGradient id="gradConfiguration" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradConfiguration)" /><g stroke="#fff" stroke-width="1.5" stroke-linecap="round"><line x1="6.5" y1="9" x2="17.5" y2="9" /><line x1="6.5" y1="12" x2="17.5" y2="12" /><line x1="6.5" y1="15" x2="17.5" y2="15" /></g><g fill="#5B45CE" stroke="#fff" stroke-width="1.5"><circle cx="10" cy="9" r="1.6" /><circle cx="15" cy="12" r="1.6" /><circle cx="9" cy="15" r="1.6" /></g></symbol><symbol id="ic-Files" viewBox="0 0 24 24"><defs><linearGradient id="gradFilesBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E6CF2" /><stop offset="1" stop-color="#5E47D8" /></linearGradient><linearGradient id="gradFilesFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A395FB" /><stop offset="1" stop-color="#8A77F2" /></linearGradient></defs><path d="M2.8,7.2 a2,2 0 0 1 2,-2 H9 a1.5,1.5 0 0 1 1.1,0.5 L11.6,7.2 H19.2 a2,2 0 0 1 2,2 V17.2 a2,2 0 0 1 -2,2 H4.8 a2,2 0 0 1 -2,-2 Z" fill="url(#gradFilesBack)" /><path d="M2.8,10 H21.2 V17.2 a2,2 0 0 1 -2,2 H4.8 a2,2 0 0 1 -2,-2 Z" fill="url(#gradFilesFront)" /></symbol><symbol id="ic-Messaging" viewBox="0 0 24 24"><defs><linearGradient id="gradMessaging" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradMessaging)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><rect x="6" y="7.5" width="12" height="9" rx="1.6" /><path d="M6.4,8.6 l5.6,4 5.6,-4" /></g></symbol><symbol id="ic-Parsing" viewBox="0 0 24 24"><defs><linearGradient id="gradParsing" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradParsing)" /><path d="M6.5,7.5 h11 l-4.2,5 v4.2 l-2.6,1.3 v-5.5 z" fill="#fff" /></symbol><symbol id="ic-Security" viewBox="0 0 24 24"><defs><linearGradient id="gradSecurity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradSecurity)" /><path d="M12,6 l5,2 v3.2 c0,3.4 -2.2,5.6 -5,6.6 c-2.8,-1 -5,-3.2 -5,-6.6 v-3.2 z" fill="#fff" /><path d="M9.9,12.2 l1.6,1.6 3,-3.3" fill="none" stroke="#5B45CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol><symbol id="ic-Utility" viewBox="0 0 24 24"><defs><linearGradient id="gradUtility" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradUtility)" /><path d="M15.9,6.6 a3.1,3.1 0 0 0 -3.9,3.9 l-4.7,4.7 a1.5,1.5 0 1 0 2.1,2.1 l4.7,-4.7 a3.1,3.1 0 0 0 3.9,-3.9 l-1.9,1.9 -1.7,-0.4 -0.4,-1.7 z" fill="#fff" /></symbol><symbol id="ic-View" viewBox="0 0 24 24"><defs><linearGradient id="gradView" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradView)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="6.5" width="13" height="11" rx="1.6" /><line x1="5.5" y1="9.6" x2="18.5" y2="9.6" /></g><g fill="#fff"><circle cx="7.7" cy="8" r="0.65" /><circle cx="9.6" cy="8" r="0.65" /></g></symbol></defs><rect width="1440" height="790" fill="var(--bg, #ffffff)"/><rect x="20" y="60" width="380" height="700" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="50" y="110" width="320" height="110" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-View" x="60" y="119" width="24" height="24"/><text x="92" y="136" font-size="12.5" font-weight="600" fill="currentColor">UI services</text><text x="62" y="158" font-size="11" fill="currentColor" fill-opacity="0.78">ModelService, cloud sync, Claude prompts,</text><text x="62" y="173" font-size="11" fill="currentColor" fill-opacity="0.78">workspace model list: they call [Rpc]</text><text x="62" y="188" font-size="11" fill="currentColor" fill-opacity="0.78">interfaces (IParserService, ...) as proxies</text><rect x="50" y="270" width="320" height="110" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Communication" x="60" y="279" width="24" height="24"/><text x="92" y="296" font-size="12.5" font-weight="600" fill="currentColor">JsonRpcService (Core)</text><text x="62" y="318" font-size="11" fill="currentColor" fill-opacity="0.78">StreamJsonRpc + System.Text.Json;</text><text x="62" y="333" font-size="11" fill="currentColor" fill-opacity="0.78">gzip from 64 KB, chunks of at most 1 MB,</text><text x="62" y="348" font-size="11" fill="currentColor" fill-opacity="0.78">base64 for the string-only transports</text><rect x="50" y="430" width="320" height="90" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Messaging" x="60" y="439" width="24" height="24"/><text x="92" y="456" font-size="12.5" font-weight="600" fill="currentColor">VsCodeMessageService</text><text x="62" y="478" font-size="11" fill="currentColor" fill-opacity="0.78">postMessage bridge (jsInterop.js),</text><text x="62" y="493" font-size="11" fill="currentColor" fill-opacity="0.78">only active inside a VS Code webview</text><rect x="50" y="570" width="320" height="160" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Messaging" x="60" y="579" width="24" height="24"/><text x="92" y="596" font-size="12.5" font-weight="600" fill="currentColor">VsCodeSend / ReceiveService</text><text x="62" y="618" font-size="11" fill="currentColor" fill-opacity="0.78">to the extension: open the editor at a</text><text x="62" y="633" font-size="11" fill="currentColor" fill-opacity="0.78">  node, parsing status, diagram loaded,</text><text x="62" y="648" font-size="11" fill="currentColor" fill-opacity="0.78">  clipboard, help</text><text x="62" y="663" font-size="11" fill="currentColor" fill-opacity="0.78">from the extension: show the node of the</text><text x="62" y="678" font-size="11" fill="currentColor" fill-opacity="0.78">  active editor, refresh, open search</text><path d="M 210.0 220.0 L 210.0 270.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><path d="M 210.0 380.0 L 210.0 430.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><rect x="540" y="60" width="380" height="700" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="570" y="110" width="320" height="100" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Configuration" x="580" y="119" width="24" height="24"/><text x="612" y="136" font-size="12.5" font-weight="600" fill="currentColor">languageServer.ts</text><text x="582" y="158" font-size="11" fill="currentColor" fill-opacity="0.78">starts server/&lt;rid&gt;/Dependinator.Lsp</text><text x="582" y="173" font-size="11" fill="currentColor" fill-opacity="0.78">(dotnet run in development);</text><text x="582" y="188" font-size="11" fill="currentColor" fill-opacity="0.78">restarted if it crashes</text><rect x="570" y="330" width="320" height="195" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Utility" x="580" y="339" width="24" height="24"/><text x="612" y="356" font-size="12.5" font-weight="600" fill="currentColor">extension.ts</text><text x="582" y="378" font-size="11" fill="currentColor" fill-opacity="0.78">relays lsp/message (UI → server)</text><text x="582" y="393" font-size="11" fill="currentColor" fill-opacity="0.78">  and ui/message (server → UI)</text><text x="582" y="408" font-size="11" fill="currentColor" fill-opacity="0.78">holds UI messages until ui/lspReady</text><text x="582" y="423" font-size="11" fill="currentColor" fill-opacity="0.78">opens files at a node&#x27;s source</text><text x="582" y="438" font-size="11" fill="currentColor" fill-opacity="0.78">follows the active editor (debounced)</text><text x="582" y="453" font-size="11" fill="currentColor" fill-opacity="0.78">file watcher → ui/refresh</text><text x="582" y="468" font-size="11" fill="currentColor" fill-opacity="0.78">status bar: parsing / idle</text><text x="582" y="483" font-size="11" fill="currentColor" fill-opacity="0.78">commands: Open, Search, Refresh, ...</text><rect x="570" y="610" width="320" height="110" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Security" x="580" y="619" width="24" height="24"/><text x="612" y="636" font-size="12.5" font-weight="600" fill="currentColor">VS Code SecretStorage</text><text x="582" y="658" font-size="11" fill="currentColor" fill-opacity="0.78">Clerk access token (cloudSyncAuth.ts)</text><text x="582" y="673" font-size="11" fill="currentColor" fill-opacity="0.78">Claude API key (claudeApiKey.ts)</text><text x="582" y="688" font-size="11" fill="currentColor" fill-opacity="0.78">never stored in the UI</text><rect x="1040" y="60" width="380" height="700" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="1070" y="110" width="320" height="100" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Messaging" x="1080" y="119" width="24" height="24"/><text x="1112" y="136" font-size="12.5" font-weight="600" fill="currentColor">LspMessageHandler</text><text x="1082" y="158" font-size="11" fill="currentColor" fill-opacity="0.78">notification lsp/message in,</text><text x="1082" y="173" font-size="11" fill="currentColor" fill-opacity="0.78">notification ui/message out</text><rect x="1070" y="260" width="320" height="90" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Communication" x="1080" y="269" width="24" height="24"/><text x="1112" y="286" font-size="12.5" font-weight="600" fill="currentColor">JsonRpcService (Core)</text><text x="1082" y="308" font-size="11" fill="currentColor" fill-opacity="0.78">the same transport class as the UI</text><rect x="1070" y="400" width="320" height="190" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Parsing" x="1080" y="409" width="24" height="24"/><text x="1112" y="426" font-size="12.5" font-weight="600" fill="currentColor">[Rpc] targets</text><text x="1082" y="448" font-size="11" fill="currentColor" fill-opacity="0.78">IParserService → Roslyn or Bicep parser</text><text x="1082" y="463" font-size="11" fill="currentColor" fill-opacity="0.78">IWorkspaceFileService: the workspace&#x27;s</text><text x="1082" y="478" font-size="11" fill="currentColor" fill-opacity="0.78">  .sln files and Bicep entry points,</text><text x="1082" y="493" font-size="11" fill="currentColor" fill-opacity="0.78">  source text for excerpts</text><text x="1082" y="508" font-size="11" fill="currentColor" fill-opacity="0.78">ICloudSyncRpcService → sync API (HTTP)</text><text x="1082" y="523" font-size="11" fill="currentColor" fill-opacity="0.78">IClaudeService → Anthropic API</text><rect x="1070" y="640" width="320" height="90" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Files" x="1080" y="649" width="24" height="24"/><text x="1112" y="666" font-size="12.5" font-weight="600" fill="currentColor">WorkspaceFolderService</text><text x="1082" y="688" font-size="11" fill="currentColor" fill-opacity="0.78">workspace folders from initialize</text><text x="1082" y="703" font-size="11" fill="currentColor" fill-opacity="0.78">and folder-change notifications</text><path d="M 1230.0 210.0 L 1230.0 260.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><path d="M 1230.0 350.0 L 1230.0 400.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><path d="M 370.0 475.0 L 570.0 475.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><text x="470.0" y="455.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">postMessage</text><text x="470.0" y="467.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">{ lsp/message, base64 }</text><path d="M 370.0 650.0 L 470.0 650.0 L 470.0 505.0 L 570.0 505.0" fill="none" stroke="var(--accent2, #b45309)" stroke-width="1.5" stroke-dasharray="6 4" marker-start="url(#arrow-async)" marker-end="url(#arrow-async)"/><text x="487.0" y="632.0" font-size="10.5" text-anchor="end" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">vscode/* and ui/*</text><text x="487.0" y="644.0" font-size="10.5" text-anchor="end" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">messages</text><path d="M 890.0 150.0 L 1070.0 150.0" fill="none" stroke="var(--accent2, #b45309)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-async)"/><text x="980.0" y="144.0" font-size="10.5" text-anchor="middle" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">spawns</text><path d="M 890.0 420.0 L 980.0 420.0 L 980.0 185.0 L 1070.0 185.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-start="url(#arrow-accent)" marker-end="url(#arrow-accent)"/><text x="974.0" y="226.0" font-size="10.5" text-anchor="end" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">LSP notifications</text><text x="974.0" y="238.0" font-size="10.5" text-anchor="end" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">over stdio</text><path d="M 730.0 330.0 L 730.0 210.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="736.0" y="274.0" font-size="10.5" text-anchor="start" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">starts</text><path d="M 1070.0 560.0 L 1000.0 560.0 L 1000.0 665.0 L 890.0 665.0" fill="none" stroke="var(--accent2, #b45309)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-async)"/><text x="991.9" y="645.0" font-size="10.5" text-anchor="end" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">asks for the token or</text><text x="991.9" y="657.0" font-size="10.5" text-anchor="end" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">the key, per request</text><text x="32" y="80" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Webview</text><text x="32" y="96" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Blazor WebAssembly: Dependinator.Wasm + UI</text><text x="552" y="80" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Extension host</text><text x="552" y="96" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">TypeScript, Node.js</text><text x="1052" y="80" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Language server</text><text x="1052" y="96" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Dependinator.Lsp, .NET, OmniSharp</text></svg>