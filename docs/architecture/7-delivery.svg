<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 660" role="img" aria-label="Delivery view of Dependinator: feature branches and Dependabot PRs merge into dev, whose pushes only run the tests; the Release workflow, run by hand on dev, runs the full gate and builds the site and a .vsix per platform, and then a preview deploys the pre-release site and a GitHub pre-release, while a release merges dev into main, deploys dependinator.com and publishes the VS Code Marketplace and a GitHub release." font-family="Segoe UI, Inter, system-ui, sans-serif" style="max-width:100%;height:auto;color:var(--fg,#1f2937)"><title>Dependinator delivery view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #2563eb)"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent2, #b45309)"/></marker><symbol id="ic-Cloud" viewBox="0 0 24 24"><defs><linearGradient id="gradCloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradCloud)" /><g fill="#fff"><circle cx="9.4" cy="13" r="2.7" /><circle cx="13.4" cy="11.4" r="3.3" /><circle cx="15.6" cy="13.6" r="2.5" /><rect x="8.6" y="13.2" width="8" height="3.4" rx="1.7" /></g></symbol><symbol id="ic-Configuration" viewBox="0 0 24 24"><defs><linearGradient id="gradConfiguration" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradConfiguration)" /><g stroke="#fff" stroke-width="1.5" stroke-linecap="round"><line x1="6.5" y1="9" x2="17.5" y2="9" /><line x1="6.5" y1="12" x2="17.5" y2="12" /><line x1="6.5" y1="15" x2="17.5" y2="15" /></g><g fill="#5B45CE" stroke="#fff" stroke-width="1.5"><circle cx="10" cy="9" r="1.6" /><circle cx="15" cy="12" r="1.6" /><circle cx="9" cy="15" r="1.6" /></g></symbol><symbol id="ic-Files" viewBox="0 0 24 24"><defs><linearGradient id="gradFilesBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7E6CF2" /><stop offset="1" stop-color="#5E47D8" /></linearGradient><linearGradient id="gradFilesFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A395FB" /><stop offset="1" stop-color="#8A77F2" /></linearGradient></defs><path d="M2.8,7.2 a2,2 0 0 1 2,-2 H9 a1.5,1.5 0 0 1 1.1,0.5 L11.6,7.2 H19.2 a2,2 0 0 1 2,2 V17.2 a2,2 0 0 1 -2,2 H4.8 a2,2 0 0 1 -2,-2 Z" fill="url(#gradFilesBack)" /><path d="M2.8,10 H21.2 V17.2 a2,2 0 0 1 -2,2 H4.8 a2,2 0 0 1 -2,-2 Z" fill="url(#gradFilesFront)" /></symbol><symbol id="ic-Security" viewBox="0 0 24 24"><defs><linearGradient id="gradSecurity" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradSecurity)" /><path d="M12,6 l5,2 v3.2 c0,3.4 -2.2,5.6 -5,6.6 c-2.8,-1 -5,-3.2 -5,-6.6 v-3.2 z" fill="#fff" /><path d="M9.9,12.2 l1.6,1.6 3,-3.3" fill="none" stroke="#5B45CE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></symbol><symbol id="ic-Static-Web-Apps" viewBox="0 0 18 18"><defs><linearGradient id="Static-Web-Apps-i1" x1="9" y1="16.236" x2="9" y2="5.599" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#005ba1" /><stop offset="0.775" stop-color="#0078d4" /></linearGradient></defs><g><path d="M0,5.6H18a0,0,0,0,1,0,0V15.635a.6.6,0,0,1-.6.6H.6a.6.6,0,0,1-.6-.6V5.6A0,0,0,0,1,0,5.6Z" fill="url(#Static-Web-Apps-i1)" /><rect x="1.309" y="6.657" width="15.527" height="8.514" rx="0.6" fill="#5ea0ef" opacity="0.6" /><path d="M.6,1.764H17.4a.6.6,0,0,1,.6.6V5.6a0,0,0,0,1,0,0H0a0,0,0,0,1,0,0V2.365A.6.6,0,0,1,.6,1.764Z" fill="#005ba1" /><path d="M7.109,13.217l-.321.32a.144.144,0,0,1-.205,0L4.258,11.205a.29.29,0,0,1,0-.41l.321-.32L7.11,13.012A.145.145,0,0,1,7.109,13.217Zm3.653,0,.321.32a.144.144,0,0,0,.205,0l2.325-2.332a.29.29,0,0,0,0-.41l-.322-.32-2.53,2.537A.145.145,0,0,0,10.762,13.217Z" fill="#fff" opacity="0.8" /><path d="M6.831,8.433l.32.321a.144.144,0,0,1,0,.205L4.576,11.527l-.32-.322a.289.289,0,0,1,0-.41l2.37-2.363A.145.145,0,0,1,6.831,8.433Zm4.207,0-.32.321a.144.144,0,0,0,0,.205l2.575,2.568.32-.321a.292.292,0,0,0,0-.411l-2.37-2.362A.144.144,0,0,0,11.038,8.434Z" fill="#fff" /><path d="M8.159,14.363,7.646,14.2a.105.105,0,0,1-.067-.131L9.669,7.54a.1.1,0,0,1,.13-.067l.513.164a.1.1,0,0,1,.067.13L8.289,14.3A.1.1,0,0,1,8.159,14.363Z" fill="#fff" /><path d="M3.166,3.847a.76.76,0,1,1-.76-.76A.76.76,0,0,1,3.166,3.847ZM4.8,3.087a.76.76,0,1,0,.76.76A.76.76,0,0,0,4.8,3.087Zm2.393,0a.76.76,0,1,0,.76.76A.76.76,0,0,0,7.191,3.087Z" fill="#fff" /></g></symbol><symbol id="ic-Testing" viewBox="0 0 24 24"><defs><linearGradient id="gradTesting" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradTesting)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2,6.6 v4.2 l-3.3,5.5 a1.4,1.4 0 0 0 1.2,2.1 h7.8 a1.4,1.4 0 0 0 1.2,-2.1 l-3.3,-5.5 v-4.2" /><line x1="9.2" y1="6.6" x2="14.8" y2="6.6" /></g><path d="M8.7,14.3 h6.6" fill="none" stroke="#fff" stroke-width="1.4" /></symbol><symbol id="ic-Utility" viewBox="0 0 24 24"><defs><linearGradient id="gradUtility" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradUtility)" /><path d="M15.9,6.6 a3.1,3.1 0 0 0 -3.9,3.9 l-4.7,4.7 a1.5,1.5 0 1 0 2.1,2.1 l4.7,-4.7 a3.1,3.1 0 0 0 3.9,-3.9 l-1.9,1.9 -1.7,-0.4 -0.4,-1.7 z" fill="#fff" /></symbol></defs><rect width="1440" height="660" fill="var(--bg, #ffffff)"/><rect x="30" y="70" width="230" height="110" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Utility" x="40" y="79" width="24" height="24"/><text x="72" y="96" font-size="12.5" font-weight="600" fill="currentColor">Feature branch</text><text x="42" y="118" font-size="11" fill="currentColor" fill-opacity="0.78">mr/&lt;what-the-work-is&gt;, from dev;</text><text x="42" y="133" font-size="11" fill="currentColor" fill-opacity="0.78">each push: unit tests + e2e</text><text x="42" y="148" font-size="11" fill="currentColor" fill-opacity="0.78">in Chromium</text><rect x="30" y="240" width="230" height="90" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Security" x="40" y="249" width="24" height="24"/><text x="72" y="266" font-size="12.5" font-weight="600" fill="currentColor">Dependabot</text><text x="42" y="288" font-size="11" fill="currentColor" fill-opacity="0.78">package updates as PRs to dev</text><text x="42" y="303" font-size="11" fill="currentColor" fill-opacity="0.78">(security PRs: merge into dev)</text><rect x="330" y="70" width="240" height="260" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Testing" x="340" y="79" width="24" height="24"/><text x="372" y="96" font-size="12.5" font-weight="600" fill="currentColor">dev</text><text x="342" y="118" font-size="11" font-weight="600" fill="currentColor" fill-opacity="0.95">the integration branch</text><text x="342" y="133" font-size="11" fill="currentColor" fill-opacity="0.78">each push: unit tests + e2e</text><text x="342" y="148" font-size="11" fill="currentColor" fill-opacity="0.78">in Chromium; nothing is</text><text x="342" y="163" font-size="11" fill="currentColor" fill-opacity="0.78">deployed by a push or a merge</text><text x="342" y="178" font-size="11" fill="currentColor" fill-opacity="0.78">holds the notes of the next</text><text x="342" y="193" font-size="11" fill="currentColor" fill-opacity="0.78">release: CHANGELOG.md&#x27;s</text><text x="342" y="208" font-size="11" fill="currentColor" fill-opacity="0.78">## [Unreleased]</text><rect x="640" y="40" width="230" height="175" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Configuration" x="650" y="49" width="24" height="24"/><text x="682" y="66" font-size="12.5" font-weight="600" fill="currentColor">release.yml, run by hand</text><text x="652" y="88" font-size="11" font-weight="600" fill="currentColor" fill-opacity="0.95">a preview or a release</text><text x="652" y="103" font-size="11" fill="currentColor" fill-opacity="0.78">the full gate: unit tests, e2e</text><text x="652" y="118" font-size="11" fill="currentColor" fill-opacity="0.78">in 3 browsers, cloud sync e2e;</text><text x="652" y="133" font-size="11" fill="currentColor" fill-opacity="0.78">builds the site and one .vsix</text><text x="652" y="148" font-size="11" fill="currentColor" fill-opacity="0.78">per platform (Linux, Windows,</text><text x="652" y="163" font-size="11" fill="currentColor" fill-opacity="0.78">macOS; x64 and arm64)</text><text x="652" y="178" font-size="11" fill="currentColor" fill-opacity="0.78">then pushes and publishes</text><rect x="640" y="270" width="230" height="100" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Static-Web-Apps" x="650" y="279" width="24" height="24"/><text x="682" y="296" font-size="12.5" font-weight="600" fill="currentColor">main</text><text x="652" y="318" font-size="11" font-weight="600" fill="currentColor" fill-opacity="0.95">releases only</text><text x="652" y="333" font-size="11" fill="currentColor" fill-opacity="0.78">the workflow merges dev into it</text><text x="652" y="348" font-size="11" fill="currentColor" fill-opacity="0.78">and raises the minor on dev</text><use href="#ic-Static-Web-Apps" x="978.0" y="283.0" width="44" height="44"/><text x="1000" y="341.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">dependinator.com</text><text x="1000" y="354.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">previews: the dev site</text><rect x="1100" y="220" width="310" height="175" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Files" x="1110" y="229" width="24" height="24"/><text x="1142" y="246" font-size="12.5" font-weight="600" fill="currentColor">GitHub release v&lt;version&gt;</text><text x="1112" y="268" font-size="11" fill="currentColor" fill-opacity="0.78">tagged on what was built:</text><text x="1112" y="283" font-size="11" fill="currentColor" fill-opacity="0.78">main&#x27;s merge, or dev for a preview</text><text x="1112" y="298" font-size="11" fill="currentColor" fill-opacity="0.78">(a pre-release)</text><text x="1112" y="313" font-size="11" fill="currentColor" fill-opacity="0.78">the .vsix packages as assets</text><text x="1112" y="328" font-size="11" fill="currentColor" fill-opacity="0.78">and the notes from CHANGELOG.md</text><use href="#ic-Cloud" x="1233.0" y="478.0" width="44" height="44"/><text x="1255" y="536.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">VS Code Marketplace</text><text x="1255" y="549.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">releases only</text><path d="M 260.0 125.0 L 330.0 125.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="295.0" y="117.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">PR, merge</text><path d="M 260.0 285.0 L 330.0 285.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="295.0" y="277.0" font-size="10.5" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">PR</text><path d="M 570.0 125.0 L 640.0 127.5" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="605.0" y="118.2" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">run on dev</text><path d="M 755.0 215.0 L 755.0 270.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="755.0" y="236.5" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">release</text><path d="M 870.0 320.0 L 972.0 308.2" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="921.0" y="306.1" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">deploy</text><path d="M 1028.0 305.0 L 1100.0 305.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="1064.0" y="297.0" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">then</text><path d="M 1255.0 395.0 L 1255.0 472.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="30" y="595" font-size="11" font-weight="600" text-anchor="start" fill="currentColor" fill-opacity="1">Quality gate</text><text x="30" y="610" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">About 900 unit tests and a Playwright suite of 4.4k lines run on every push (build.yml calls unit-tests.yml and e2e.yml), and the Release workflow runs them all before it publishes;</text><text x="30" y="625" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">Playwright traces are uploaded when an e2e test fails. CSharpier formatting is checked during the build, and the architecture tests guard the layering.</text></svg>