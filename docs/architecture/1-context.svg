<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-label="Context view of Dependinator: developers use the VS Code extension, which parses their workspace; evaluators use the web app at dependinator.com; contributors use the Blazor Server dev host. The VS Code extension and the web app can sync models through a small Azure Functions API with Blob Storage that validates Clerk sign-in tokens; the Claude API is used, optionally, with the user&#x27;s own key." font-family="Segoe UI, Inter, system-ui, sans-serif" style="max-width:100%;height:auto;color:var(--fg,#1f2937)"><title>Dependinator context view</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent, #2563eb)"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent2, #b45309)"/></marker><symbol id="ic-Api" viewBox="0 0 24 24"><defs><linearGradient id="gradApi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradApi)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5,7 C8,7 8.2,9 8.2,9.8 C8.2,11 7.4,11.4 6.8,12 C7.4,12.6 8.2,13 8.2,14.2 C8.2,15 8,17 9.5,17" /><path d="M14.5,7 C16,7 15.8,9 15.8,9.8 C15.8,11 16.6,11.4 17.2,12 C16.6,12.6 15.8,13 15.8,14.2 C15.8,15 16,17 14.5,17" /></g><circle cx="12" cy="12" r="1" fill="#fff" /></symbol><symbol id="ic-Authentication" viewBox="0 0 24 24"><defs><linearGradient id="gradAuthentication" x1="0" y1="0" x2="0" 