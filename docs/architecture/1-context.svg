"M3.166,3.847a.76.76,0,1,1-.76-.76A.76.76,0,0,1,3.166,3.847ZM4.8,3.087a.76.76,0,1,0,.76.76A.76.76,0,0,0,4.8,3.087Zm2.393,0a.76.76,0,1,0,.76.76A.76.76,0,0,0,7.191,3.087Z" fill="#fff" /></g></symbol><symbol id="ic-Testing" viewBox="0 0 24 24"><defs><linearGradient id="gradTesting" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradTesting)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.2,6.6 v4.2 l-3.3,5.5 a1.4,1.4 0 0 0 1.2,2.1 h7.8 a1.4,1.4 0 0 0 1.2,-2.1 l-3.3,-5.5 v-4.2" /><line x1="9.2" y1="6.6" x2="14.8" y2="6.6" /></g><path d="M8.7,14.3 h6.6" fill="none" stroke="#fff" stroke-width="1.4" /></symbol><symbol id="ic-View" viewBox="0 0 24 24"><defs><linearGradient id="gradView" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B6BE8" /><stop offset="1" stop-color="#5B45CE" /></linearGradient></defs><rect x="3" y="3" width="18" height="18" rx="3.6" fill="url(#gradView)" /><g fill="none" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"><rect x="5.5" y="6.5" width="13" height="11" rx="1.6" /><line x1="5.5" y1="9.6" x2="18.5" y2="9.6" /></g><g fill="#fff"><circle cx="7.7" cy="8" r="0.65" /><circle cx="9.6" cy="8" r="0.65" /></g></symbol></defs><rect width="1400" height="790" fill="var(--bg, #ffffff)"/><rect x="30" y="70" width="200" height="630" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="280" y="70" width="660" height="630" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><rect x="990" y="70" width="380" height="630" rx="10" fill="currentColor" fill-opacity="0.035" stroke="currentColor" stroke-opacity="0.35"/><circle cx="130" cy="172" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M 114 198 a 16 14 0 0 1 32 0" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="130" y="212" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Developer</text><text x="130" y="224" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">VS Code, a C# solution</text><text x="130" y="236" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">or a Bicep deployment</text><circle cx="130" cy="372" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M 114 398 a 16 14 0 0 1 32 0" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="130" y="412" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Evaluator</text><text x="130" y="424" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">a browser, nothing</text><text x="130" y="436" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">installed</text><circle cx="130" cy="572" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M 114 598 a 16 14 0 0 1 32 0" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="130" y="612" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Contributor</text><text x="130" y="624" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">works on Dependinator</text><text x="130" y="636" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">itself</text><rect x="320" y="120" width="300" height="125" rx="8" fill="var(--accent, #2563eb)" fill-opacity="0.10" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-View" x="330" y="129" width="24" height="24"/><text x="362" y="146" font-size="12.5" font-weight="600" fill="currentColor">VS Code extension</text><text x="332" y="168" font-size="11" fill="currentColor" fill-opacity="0.78">the product, on the VS Code Marketplace</text><text x="332" y="183" font-size="11" fill="currentColor" fill-opacity="0.78">parses the open workspace and draws it</text><text x="332" y="198" font-size="11" fill="currentColor" fill-opacity="0.78">jumps between the diagram and the code</text><text x="332" y="213" font-size="11" fill="currentColor" fill-opacity="0.78">webview UI + bundled .NET language server</text><rect x="320" y="320" width="300" height="125" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Static-Web-Apps" x="330" y="329" width="24" height="24"/><text x="362" y="346" font-size="12.5" font-weight="600" fill="currentColor">Web app · dependinator.com</text><text x="332" y="368" font-size="11" fill="currentColor" fill-opacity="0.78">Azure Static Web Apps</text><text x="332" y="383" font-size="11" fill="currentColor" fill-opacity="0.78">built-in demo models (pre-parsed),</text><text x="332" y="398" font-size="11" fill="currentColor" fill-opacity="0.78">hand-drawn design models, share links</text><text x="332" y="413" font-size="11" fill="currentColor" fill-opacity="0.78">and models synced from the cloud</text><rect x="320" y="520" width="300" height="125" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Testing" x="330" y="529" width="24" height="24"/><text x="362" y="546" font-size="12.5" font-weight="600" fill="currentColor">Dev host · localhost:5000</text><text x="332" y="568" font-size="11" fill="currentColor" fill-opacity="0.78">Blazor Server, for development</text><text x="332" y="583" font-size="11" fill="currentColor" fill-opacity="0.78">parses this repository with Roslyn</text><text x="332" y="598" font-size="11" fill="currentColor" fill-opacity="0.78">the app the e2e tests drive</text><text x="332" y="613" font-size="11" fill="currentColor" fill-opacity="0.78">./scripts/watch, ./scripts/e2e</text><rect x="690" y="320" width="220" height="125" rx="8" fill="var(--bg, #ffffff)" stroke="currentColor" stroke-opacity="0.55"/><use href="#ic-Azure-Functions" x="700" y="329" width="24" height="24"/><text x="732" y="346" font-size="12.5" font-weight="600" fill="currentColor">Cloud sync API</text><text x="702" y="368" font-size="11" fill="currentColor" fill-opacity="0.78">Azure Functions (src/Api)</text><text x="702" y="383" font-size="11" fill="currentColor" fill-opacity="0.78">+ Blob Storage</text><text x="702" y="398" font-size="11" fill="currentColor" fill-opacity="0.78">one folder per user</text><text x="702" y="413" font-size="11" fill="currentColor" fill-opacity="0.78">at most 10 MB per user</text><use href="#ic-Solution" x="1158.0" y="160.0" width="44" height="44"/><text x="1180" y="218.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Workspace source</text><text x="1180" y="231.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">.sln + C# projects,</text><text x="1180" y="243.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">.bicep entry files + local modules</text><use href="#ic-Authentication" x="1158.0" y="360.0" width="44" height="44"/><text x="1180" y="418.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Clerk</text><text x="1180" y="431.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">hosted sign-in, issues the</text><text x="1180" y="443.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">JWTs the API checks</text><use href="#ic-Api" x="1158.0" y="560.0" width="44" height="44"/><text x="1180" y="618.0" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">Anthropic Claude API</text><text x="1180" y="631.0" font-size="10.5" text-anchor="middle" fill="currentColor" fill-opacity="0.72">optional, with the user&#x27;s own key</text><path d="M 154.0 182.0 L 320.0 182.3" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="237.0" y="174.2" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">Dependinator: Open</text><path d="M 154.0 382.0 L 320.0 382.3" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="237.0" y="374.2" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">HTTPS</text><path d="M 154.0 582.0 L 320.0 582.3" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="237.0" y="574.2" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">browser</text><path d="M 620.0 182.5 L 1152.0 182.0" fill="none" stroke="var(--accent, #2563eb)" stroke-width="1.5" marker-end="url(#arrow-accent)"/><text x="859.4" y="174.3" font-size="10.5" text-anchor="middle" fill="var(--accent, #2563eb)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">reads and parses the workspace</text><path d="M 560.0 245.0 L 560.0 280.0 L 800.0 280.0 L 800.0 320.0" fill="none" stroke="var(--accent2, #b45309)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-async)"/><text x="766.4" y="274.0" font-size="10.5" text-anchor="middle" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">optional sync</text><path d="M 620.0 382.5 L 690.0 382.5" fill="none" stroke="var(--accent2, #b45309)" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-async)"/><text x="655.0" y="374.5" font-size="10.5" text-anchor="middle" fill="var(--accent2, #b45309)" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">/api</text><path d="M 910.0 382.5 L 1152.0 382.1" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1018.9" y="374.3" font-size="10.5" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">validates sign-in tokens</text><path d="M 620.0 582.5 L 1152.0 582.0" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/><text x="859.4" y="574.3" font-size="10.5" text-anchor="middle" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:3px;stroke-linejoin:round">&quot;Ask Claude&quot; about a cycle (also from VS Code)</text><text x="40" y="735" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">Solid blue: how people reach the product and how it reads code. Dashed brown: the optional cloud sync.</text><text x="40" y="750" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">Parsing runs locally, in VS Code or the dev host. Cloud sync stores the drawn model (nodes, links, layout, notes), never source files;</text><text x="40" y="765" font-size="11" text-anchor="start" fill="currentColor" fill-opacity="0.8">asking Claude about a cycle sends a prompt with the code excerpts involved, with the user&#x27;s own API key.</text><text x="42" y="90" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">People</text><text x="292" y="90" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">Dependinator</text><text x="292" y="106" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">one Blazor UI, three hosts, one small cloud API</text><text x="1002" y="90" font-size="13" font-weight="600" fill="currentColor" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">External</text><text x="1002" y="106" font-size="11" fill="currentColor" fill-opacity="0.7" style="paint-order:stroke;stroke:var(--bg, #ffffff);stroke-width:4px;stroke-linejoin:round">not run by Dependinator</text></svg>