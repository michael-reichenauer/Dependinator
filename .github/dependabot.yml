# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Enable version updates for nuget
  - package-ecosystem: "nuget"
    # Look for NuGet dependency info from the root directory
    directory: "/"
    # Open the PRs against dev, not main: dev is the integration branch, and a bump ships
    # with the next release, which the Release workflow makes by merging dev into main
    # (docs/RELEASING.md). Security updates are not affected by this setting: GitHub
    # always opens those against the default branch (main); merge their branch into dev
    # instead, and the main PR closes itself after the next release.
    target-branch: "dev"
    # Check the nuget registry for updates every week
    schedule:
      interval: "weekly"
    # One PR per week for all minor and patch bumps; major bumps stay separate PRs.
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The Bicep compiler library is unsupported by Microsoft and may change its API in any
      # release (see Directory.Packages.props); it is bumped by hand after a build check.
      - dependency-name: "Azure.Bicep.Core"

  # The TypeScript parser's helper (the TypeScript compiler and esbuild, bundled into
  # Dependinator.TypeScriptParser by its build). The unit tests parse the sample projects with the
  # bumped compiler, so a green CI covers a bump.
  - package-ecosystem: "npm"
    directory: "/src/Dependinator.TypeScriptParser/NodeParser"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      helper-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is the native compiler, whose tool API is not stable before 7.1; the helper
      # uses the JavaScript API of the 6.x line (docs/notes/TYPESCRIPT-PARSER.md).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
