name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task or situation where Dependinator falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How should it work? Sketches, screenshots from other tools or a mock-up are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives
      description: Anything you do today instead, or other ways this could be solved.
  - type: input
    id: version
    attributes:
      label: Dependinator version
      description: Filled in by Menu › Help › Suggest an Improvement.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in by Menu › Help › Suggest an Improvement. Remove anything you do not want to share.
      render: text
