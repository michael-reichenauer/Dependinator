name: PR test site

# Each pull request into dev or main gets its own test site on Azure Static Web Apps, updated on
# every push to it and removed when it closes. That is all this workflow deploys: the pre-release
# site and production are deployed only by the Release workflow (release.yml), and the tests run
# in the Build workflow (build.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, dev]

# Least-privilege GITHUB_TOKEN: the repository default is write-all, so the workflow states what
# each job needs instead; the deploy job adds what the Azure deploy action needs to comment the
# test site's url on the pull request.
permissions:
  contents: read

jobs:
  # Dependabot PR runs get no repository secrets (GitHub policy), so the SWA deploy
  # would fail on a missing token; their tests still run in the Build workflow.
  build_and_deploy_job:
    if: github.actor != 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write # repo_token: the preview url comment on the pull request
      issues: write # pull request comments go through the issues API
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # net10.0 runtime; global.json selects the .NET 11 SDK
          global-json-file: global.json
      - name: Install WASM workload
        run: dotnet workload restore Dependinator.sln
      - name: Restore
        run: dotnet restore Dependinator.sln
      - name: Publish Dependinator WASM
        run: |
          rm -rf src/Dependinator.Wasm/publish
          dotnet publish src/Dependinator.Wasm/Dependinator.Wasm.csproj -c Release --no-restore -o src/Dependinator.Wasm/publish
          cp src/Dependinator.Wasm/staticwebapp.config.json src/Dependinator.Wasm/publish/wwwroot/staticwebapp.config.json
      - name: Publish API
        run: |
          rm -rf src/Api/publish
          dotnet publish src/Api/Api.csproj -c Release -o src/Api/publish
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_ISLAND_0E6A6EB03 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "src/Dependinator.Wasm/publish/wwwroot" # Prebuilt app content
          api_location: "src/Api/publish"
          skip_app_build: true
          skip_api_build: true
          ###### End of Repository/Build Configurations ######
          production_branch: "main" # never a push here, so always a pull request's test site

  close_pull_request_job:
    if: github.actor != 'dependabot[bot]' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions: {} # only the Azure deployment token is used here
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_ISLAND_0E6A6EB03 }}
          action: "close"
