name: E2E (Playwright)

# Runs the Dependinator.E2E.Tests UI suite via ./scripts/e2e. The Build workflow calls it on every
# push with Chromium only, no cloud-sync — a quick check. The Release workflow calls it on what it
# releases with browsers=all + sync=true, so the pre-publish gate covers all browsers and the
# cloud-sync ([SyncFact]) tests. Can also be run manually. Each browser
# runs as its own parallel job (one job running all three in turn took ~15 min of the gate).
# The suite runs without tracing (a trace per test doubled the suite time, and the load caused
# flakes); failed tests are re-run with a trace each, uploaded as a playwright-traces-<browser>
# artifact (open the .zip at trace.playwright.dev).
on:
  workflow_call:
    inputs:
      browsers:
        description: "chromium | all"
        type: string
        default: chromium
      sync:
        description: Also run the cloud-sync tests (./scripts/e2e -s)
        type: boolean
        default: false
      sha:
        description: The commit to test (the Release workflow's); empty for the commit that started the run
        type: string
        default: ""
      bundle:
        description: Fetch the commit from the Release workflow's release-bundle artifact
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      browsers:
        description: Browsers to test
        type: choice
        options: [chromium, all]
        default: chromium
      sync:
        description: Also run the cloud-sync tests (./scripts/e2e -s)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The Build workflow passes no inputs, which runs Chromium only, without sync.
    strategy:
      # Let the other browsers finish when one fails, to tell a browser-specific failure
      # from a flake.
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers == 'all' && '["chromium","firefox","webkit"]' || '["chromium"]') }}
    steps:
      # The Release workflow passes what it releases: a sha, and for a release the git bundle with
      # its commits, which are not pushed yet. Otherwise the commit that started the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.bundle && github.sha || inputs.sha }}
          fetch-depth: ${{ inputs.bundle && '0' || '1' }}

      - name: Download the release commits
        if: inputs.bundle
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: ${{ runner.temp }}/bundle

      - name: Check out the release commit
        if: inputs.bundle
        run: |
          git fetch "$RUNNER_TEMP/bundle/release.bundle" "+refs/heads/*:refs/remotes/release/*"
          git checkout -q --detach "${{ inputs.sha }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x" # net10.0 runtime; global.json selects the .NET 11 SDK
          global-json-file: global.json

      # The cloud-sync API (Api) is a .NET 8 isolated Functions worker, so its runtime is
      # needed (alongside the SDK from global.json) to run the sync tests.
      - name: Setup .NET 8 runtime (sync tests)
        if: inputs.sync
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Build the test project so playwright.ps1 (used to install browsers) exists.
      - name: Build e2e test project
        run: dotnet build tests/Dependinator.E2E.Tests/Dependinator.E2E.Tests.csproj

      - name: Install Playwright browsers
        run: pwsh tests/Dependinator.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      # ./scripts/e2e -s starts the cloud-sync stack itself but needs these tools on the runner.
      - name: Install Azure Functions Core Tools + Azurite (sync tests)
        if: inputs.sync
        run: |
          # Azurite is a pure-Node package — reliable via npm.
          npm install -g azurite
          # Azure Functions Core Tools: install from the Microsoft apt feed. (The npm
          # package downloads a binary from a CDN during install, which is flaky on CI.)
          if ! command -v func >/dev/null; then
            sudo apt-get update
            if ! sudo apt-get install -y azure-functions-core-tools-4; then
              # Runner is missing the Microsoft package feed — add it and retry.
              wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb" -O /tmp/pmc.deb
              sudo dpkg -i /tmp/pmc.deb
              sudo apt-get update
              sudo apt-get install -y azure-functions-core-tools-4
            fi
          fi
          func --version

      # ./scripts/e2e starts Dependinator.Web itself (test mode, embedded demo model) and stops it
      # afterwards. -r re-runs the failed tests with tracing for the artifact below.
      - name: Run e2e tests
        run: ./scripts/e2e -r -b ${{ matrix.browser }}${{ inputs.sync && ' -s' || '' }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: tests/Dependinator.E2E.Tests/traces/
          if-no-files-found: ignore
          retention-days: 14
